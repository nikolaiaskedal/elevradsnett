<!-- E-postmal for engangskoden. Brukes for både «Magic Link» og «Confirm signup» i Supabase Auth. -->
<div style="font-family: system-ui, sans-serif; color: #0A466E; max-width: 480px; margin: 0 auto; padding: 24px;">
  <h1 style="font-size: 20px; margin: 0 0 12px;">Koden din til Elevrådsnett</h1>
  <p style="line-height: 1.6; margin: 0 0 16px;">Skriv inn denne koden i Elevrådsnett for å logge inn:</p>
  <p style="font-size: 32px; font-weight: 600; letter-spacing: 8px; margin: 0 0 16px; color: #FF6340;">{{ .Token }}</p>
  <p style="line-height: 1.6; margin: 0 0 8px;">Koden gjelder i 10 minutter og kan bare brukes én gang.</p>
  <p style="line-height: 1.6; margin: 0; color: #85A2B7;">Har du ikke bedt om å logge inn, kan du se bort fra denne e-posten. Spørsmål? Skriv til teknisk@elev.no.</p>
</div>
